[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-disease-detection"
version = "1.0.0"
description = "Deep-learning classification of brain MRI/CT scans (Alzheimer's, stroke, tumor) with a Flask web app and JSON API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chetan Kumor" }]
keywords = ["deep-learning", "medical-imaging", "tensorflow", "flask", "cnn", "transfer-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "flask>=3.0,<4.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tensorflow>=2.16,<2.20",
    "gunicorn>=21.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/ChetanKumor/Brain-Disease-Detection"

[project.scripts]
brain-disease-train = "brain_disease_detection.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_disease_detection = ["web/templates/*.html", "web/static/**/*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
packages = ["brain_disease_detection"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
